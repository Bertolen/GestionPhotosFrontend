version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestion-photos-frontend:latest
    container_name: gestion-photos-frontend
    ports:
      - "8080:80"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
